name: windows
# Runs on a self-hosted Windows runner (protocompile-omen), by manual
# dispatch only, once per release before tagging, on the latest Go. Nothing
# starts it automatically: dispatching it is a release step (see
# CONTRIBUTING.md). Release and tag triggers plus a two-version matrix used
# to run the suite six times per release on a runner shared with eight other
# repositories, and no Windows failure has been specific to the older Go.
#
# This workflow was disabled_manually from 2026-07-17 to 2026-09-03 after
# three red runs, while both this file and CONTRIBUTING.md continued to
# describe it as gating releases. Five releases shipped in that window.
on:
  workflow_dispatch: {} # manual runs via `gh workflow run`
permissions:
  contents: read
jobs:
  windows:
    name: windows
    env:
      PROTOC_ARTIFACT_SUFFIX: win64
      PATH_SEP: ;
      # Scoped to this job rather than `git config --global`. The runner
      # service runs as NT AUTHORITY\NETWORK SERVICE, whose global git
      # config is shared with the eight other repositories' runners on this
      # machine — writing core.autocrlf there would reach all of them.
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      - shell: bash
        run: make protoc && go test ./...
