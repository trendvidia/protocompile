name: windows
# Cost-conscious trigger policy — see ci.yaml and CONTRIBUTING.md for the
# full rationale. windows runners are particularly expensive, so this
# workflow is even more restrictive than ci.yaml: it fires only on
# release events, tag pushes, and manual dispatch.
on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch: {} # manual runs via `gh workflow run`
permissions:
  contents: read
jobs:
  windows:
    name: windows (go:${{ matrix.go-version.name }})
    env:
      PROTOC_ARTIFACT_SUFFIX: win64
      PATH_SEP: ;
    runs-on: windows-latest
    strategy:
      matrix:
        go-version:
          - name: latest
            version: 1.26.x
          - name: previous
            version: 1.25.x
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version.version }}
      - shell: bash
        run: make protoc && go test ./...
