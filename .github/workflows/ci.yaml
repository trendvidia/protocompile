name: ci
# Cost-conscious trigger policy (see CONTRIBUTING.md):
#
#   - release / tag push: gate every release
#   - pull_request: ONLY when CI-relevant config or dependencies change
#     (workflow files, linter config, module files). Code-only PRs are
#     validated locally with `make ci-local` and do not consume cloud minutes
#   - workflow_dispatch: manual override for sanity-checking before merge
#     (`gh workflow run ci.yaml --ref <branch>`)
#
# Removed (deliberately):
#   - push to default branch — devs run `make ci-local` before pushing;
#     `make ci-local-full` before tagging a release
#   - nightly schedule — Dependabot PRs already cover dep-rot via the
#     dependency-file paths below
on:
  release:
    types: [published]
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'Makefile'
      - '.golangci.yml'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'internal/benchmarks/go.mod'
      - 'internal/benchmarks/go.sum'
      - 'internal/tools/go.mod'
      - 'internal/tools/go.sum'
  workflow_dispatch: {} # manual runs via `gh workflow run`
permissions:
  contents: read
jobs:
  test:
    name: test (go:${{ matrix.go-version.name }}, ${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version:
          - name: latest
            version: 1.26.x
          - name: previous
            version: 1.25.x
        goarch: [amd64, 386]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version.version }}
      - run: make test
        env:
          GOARCH: ${{ matrix.goarch }}
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
      - run: make benchmarks
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
      - run: make generate
      - run: make checkgenerate
      # Often, lint & gofmt guidelines depend on the Go version. To prevent
      # conflicting guidance, run only on the most recent supported version.
      # For the same reason, only check generated code on the most recent
      # supported version.
      - run: make lint
