name: ci
# Trigger policy (see CONTRIBUTING.md):
#
#   - pull_request: EVERY pull request. This repository parses `.proto`,
#     lowers annotations and emits the carriers the rest of the family
#     reads, so a change to the parser, the IR or a lowering pass must not
#     be able to merge without the suite having run against it
#   - release / tag push: gate every release
#   - workflow_dispatch: manual runs (`gh workflow run ci.yaml --ref <branch>`)
#
# The expensive legs stay off pull requests, each in its own workflow that
# says so rather than being hidden behind a path filter here:
#   - benchmarks.yaml — release, tag push, manual dispatch
#   - windows.yaml    — release, tag push, manual dispatch
#
# Removed (deliberately):
#   - `pull_request.paths` — it listed only manifests and build config, so
#     source-only PRs ran nothing at all and still showed a green tick
#     (#146). The suite is short; filtering it saved little and cost the
#     signal a reviewer uses to decide
#   - push to default branch — every change arrives by pull request, which
#     is now covered
#   - nightly schedule — Dependabot PRs already cover dep-rot
on:
  release:
    types: [published]
  push:
    tags: ['v*']
  pull_request: {}
  workflow_dispatch: {} # manual runs via `gh workflow run`
permissions:
  contents: read
jobs:
  # The race pass is split by package: fdp, ir and benchmark each take
  # 10-14 minutes under -race, and on one runner they shared its cores.
  # `rest` is every other package, so a new package is never left out; a
  # named shard that disappears fails its `go test`.
  test-race:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [fdp, ir, benchmark, rest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Select packages
        run: |
          if [ "${{ matrix.shard }}" = rest ]; then
            pkgs=$(go list ./... | grep -vxE 'github.com/trendvidia/protocompile/(fdp|ir|benchmark)' | tr '\n' ' ')
          else
            pkgs=./${{ matrix.shard }}
          fi
          echo "TEST_PKGS=$pkgs" >> "$GITHUB_ENV"
      - run: make test-race TEST_PKGS="$TEST_PKGS"
  test-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-legacy
  # `test` is the check the branch ruleset requires; it passes only when
  # every leg above passed, so splitting the suite left the gate's name
  # alone.
  test:
    needs: [test-race, test-legacy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every test leg passed
        run: |
          echo 'race: ${{ needs.test-race.result }}, legacy: ${{ needs.test-legacy.result }}'
          [ '${{ needs.test-race.result }}' = success ] && [ '${{ needs.test-legacy.result }}' = success ]
  specdrift:
    # The vendored protowire schema copies must match canonical. This ran
    # nowhere until #198: the Makefile target existed, gated ci-local-full,
    # and skipped into exit 0 whenever a sibling checkout was absent — so a
    # green board said nothing about it. The script fetches canonical rather
    # than assuming a checkout, and never skips.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make checkspecdrift

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make generate
      - run: make checkgenerate
      # Often, lint & gofmt guidelines depend on the Go version. To prevent
      # conflicting guidance, run only on the most recent supported version.
      # For the same reason, only check generated code on the most recent
      # supported version.
      - run: make lint
