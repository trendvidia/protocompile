version: v2
# Generates the RFC-001 protowire.schema.v1 carrier types (SourceMap,
# Annotation, AnnotationList, the descriptor.proto Options extensions,
# ...) and the runtime Report types to the public import path
# github.com/trendvidia/protocompile/gen/protowire/schema/v1 so that
# external consumers (protolsp, protocheck, codegen tools, gRPC
# adapters embedding Report in google.rpc.Status.details) can read the
# carriers off compiled descriptors and exchange wire reports.
# Everything else in the workspace stays under internal/gen — see
# buf.gen.yaml.
inputs:
  - directory: .
    paths:
      - proto/protowire/schema/v1/descriptor.proto
      - proto/protowire/schema/v1/report.proto
      # AnnotationArg and LiteralValue carry pxf.BigInt / Decimal /
      # BigFloat directly (protowire#263), so the public carrier types
      # cannot be used without these.
      - proto/pxf/bignum.proto
managed:
  enabled: true
  override:
   - file_option: go_package_prefix
     value: 'github.com/trendvidia/protocompile/gen'
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt: paths=source_relative
