version: v2
inputs:
  - directory: .
    # protowire/schema/v1/descriptor.proto, report.proto and
    # pxf/bignum.proto are generated in github.com/trendvidia/protos;
    # the copies here are import sources only (trendvidia/protos#1).
    exclude_paths:
      - proto/protowire/schema/v1/descriptor.proto
      - proto/protowire/schema/v1/report.proto
      - proto/pxf/bignum.proto
managed:
  enabled: true
  override:
   - file_option: go_package_prefix
     value: 'github.com/trendvidia/protocompile/internal/gen'
   - path: internal/proto
     file_option: go_package_prefix
     value: 'github.com/trendvidia/protocompile/internal/gen/internal_'
   # Generated files that import these (config.pb.go) reference the Go
   # packages in github.com/trendvidia/protos.
   - path: protowire/schema/v1/descriptor.proto
     file_option: go_package_prefix
     value: 'github.com/trendvidia/protos'
   - path: protowire/schema/v1/report.proto
     file_option: go_package_prefix
     value: 'github.com/trendvidia/protos'
   - path: pxf/bignum.proto
     file_option: go_package_prefix
     value: 'github.com/trendvidia/protos'
plugins:
  - remote: buf.build/protocolbuffers/go
    out: internal/gen
    opt: paths=source_relative
