version: v2
inputs:
  - directory: .
    # protowire/schema/v1/descriptor.proto is generated to the public
    # gen/ tree instead — see buf.gen.public.yaml.
    exclude_paths:
      - proto/protowire/schema/v1/descriptor.proto
managed:
  enabled: true
  override:
   - file_option: go_package_prefix
     value: 'github.com/trendvidia/protocompile/internal/gen'
   - path: internal/proto
     file_option: go_package_prefix
     value: 'github.com/trendvidia/protocompile/internal/gen/internal_'
   # The RFC-001 carrier types are public API (issue #92): generated
   # files that import them (report.pb.go) must reference the public
   # import path.
   - path: protowire/schema/v1/descriptor.proto
     file_option: go_package_prefix
     value: 'github.com/trendvidia/protocompile/gen'
plugins:
  - remote: buf.build/protocolbuffers/go
    out: internal/gen
    opt: paths=source_relative
